  <body class="bg-[#0c0f14] select-none">
    <script>
      window.addEventListener('error', function(e) {
        if (!document.getElementById('root') || !document.getElementById('root').hasChildNodes()) {
          var b = document.getElementById('spotplay-fallback-err');
          if (!b) {
            b = document.createElement('div');
            b.id = 'spotplay-fallback-err';
            b.style.cssText = 'position:fixed;inset:0;background:#0c0f14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;z-index:999999;';
            b.innerHTML = '<div style="font-size:40px;margin-bottom:12px">✨</div><h2 style="color:#ffb800;font-size:18px;margin-bottom:8px">Spot Play</h2><p style="color:#a1a1aa;font-size:13px;max-width:300px;margin-bottom:16px">Se detectó una versión previa en memoria. Toca abajo para abrir limpio.</p><button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:#ffb800;color:#000;font-weight:bold;padding:12px 24px;border:none;border-radius:99px;cursor:pointer;font-size:14px">🔄 Abrir Spot Play</button>';
            document.body.appendChild(b);
          }
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
